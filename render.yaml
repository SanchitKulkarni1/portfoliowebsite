# Render Blueprint for the Career Graph API (backend/). The portfolio frontend is deployed separately.
services:
  - type: web
    name: career-graph-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        value: neo4j
      - key: NEO4J_PASSWORD
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://sanchitkulkarni.vercel.app,http://localhost:8080
      - key: ALLOWED_ORIGIN_REGEX
        value: https://(frontend|sanchitkulkarni)(-[a-z0-9-]+)?-sanchit-kulkarnis-projects\.vercel\.app
