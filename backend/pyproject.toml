[project]
name = "career-graph-api"
version = "1.0.0"
description = "Text-to-Cypher GraphRAG API over a Neo4j graph of Sanchit Kulkarni's career."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: needs a running Neo4j (set NEO4J_TEST_URI); wipes the target database"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
    "B008",  # FastAPI's Depends() in argument defaults is the intended pattern
    "E501",  # ruff format owns line length; long prose strings (prompts) are fine
]
