# Render's free plan sleeps after ~15 minutes without traffic, and the next visitor waits
# 30-60s for it to wake. Pinging it keeps the chatbot responsive. /health/ready also runs a
# query, which keeps the Neo4j Aura free instance from pausing for inactivity.
#
# GitHub may delay scheduled runs at busy times, so this runs more often than strictly needed.
name: Keep backend warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health/ready
        run: |
          curl --fail --silent --show-error --max-time 90 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://portfoliowebsite-vi3f.onrender.com/health/ready
